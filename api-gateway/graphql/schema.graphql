"A datetime string with format 'Y-m-d H:i:s'."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    rutes: [Rute!]! @field(resolver: "App\\GraphQL\\Queries\\Rutes")
    buses: [Bus!]! @field(resolver: "App\\GraphQL\\Queries\\Buses")
}

type Mutation {
    createRute(
        name: String! 
        origin: String! 
        destination: String! 
        jadwal: String 
    ): Rute! @field(resolver: "App\\GraphQL\\Mutations\\AddRouteMutation")

    addBus(
        code: String!
        capacity: Int!
        route_id: Int!
        lat: Float
        lng: Float
    ): Bus! @field(resolver: "App\\GraphQL\\Mutations\\AddBusMutation")
}

type Rute {
    id: ID!
    name: String! 
    origin: String! 
    destination: String! 
    jadwal: Jadwal 
    halte: [Halte!] 
    created_at: DateTime!
    updated_at: DateTime!
}

type Bus {
    id: ID!
    code: String!
    capacity: Int!
    route_id: Int!
    lat: Float
    lng: Float
    created_at: DateTime!
    updated_at: DateTime!
}

type Jadwal {
    catatan: String
    rute_teks: String
    headway_teks: String
    jam_operasional: String
    jam_operasional_minggu: String
}

type Halte {
    id: ID!
    nama_halte: String!
    urutan: Int!
    rute_id: Int!
    created_at: DateTime!
    updated_at: DateTime!
}