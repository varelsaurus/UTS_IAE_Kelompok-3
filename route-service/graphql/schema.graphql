"A datetime string with format 'Y-m-d H:i:s'."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    rutes: [Rute!]! @all
    rute(id: ID! @eq): Rute @find
}

type Mutation {
    createRute(
        name: String! @rename(attribute: "nama_rute")
        origin: String! @rename(attribute: "titik_awal")
        destination: String! @rename(attribute: "titik_akhir")
        # Jika input mutation berupa string JSON, biarkan String. 
        # Jika ingin input object, perlu buat Input Type terpisah.
        jadwal: String 
    ): Rute! @create
}

type Rute {
    id: ID!
    name: String! @rename(attribute: "nama_rute")
    origin: String! @rename(attribute: "titik_awal")
    destination: String! @rename(attribute: "titik_akhir")
    
    # --- PERUBAHAN DI SINI ---
    # Ubah dari String menjadi tipe Jadwal
    jadwal: Jadwal 
    # -------------------------

    halte: [Halte!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

# --- TAMBAHKAN TYPE BARU INI ---
# Struktur ini dibuat berdasarkan error log yang kamu kirim
type Jadwal {
    catatan: String
    rute_teks: String
    headway_teks: String
    jam_operasional: String
    jam_operasional_minggu: String
}
# -------------------------------

type Halte {
    id: ID!
    nama_halte: String!
    urutan: Int!
    created_at: DateTime!
    updated_at: DateTime!
}